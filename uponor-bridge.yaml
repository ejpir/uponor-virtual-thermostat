# Bridges an Uponor Smatrix bus to Home Assistant with no per-house setup:
# the thermostats and the main thermostat are detected on the bus.
esphome:
  name: uponor-bridge
  friendly_name: Uponor Bridge

esp32:
  board: m5stick-c
  framework:
    type: esp-idf

logger:

# reboot_timeout 0: the stick must keep running with no Home Assistant connected.
api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Uponor Bridge Setup
    password: !secret ap_password

captive_portal:

# web/ui.js replaces the stock page; css_url and js_url stay empty so it needs no internet.
web_server:
  port: 80
  version: 3
  css_url: ""
  js_url: ""
  js_include: web/ui.js
  log: false
  auth:
    username: admin
    password: !secret web_password

external_components:
  - source:
      type: local
      path: components
    components: [uponor_auto]

uart:
  id: uponor_uart
  tx_pin:
    number: GPIO0
    ignore_strapping_warning: true
  rx_pin: GPIO26
  baud_rate: 19200

uponor_auto:
  uart_id: uponor_uart
